<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guest List - Christmas Party 2025</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">🎄 Christmas Party 2025</h1>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="guests.html" class="active">Guest List</a></li>
                <li><a href="checklist.html">Checklist</a></li>
                <li><a href="planning.html">Planning</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <section class="page-header">
            <h2>Guest List Management</h2>
            <button onclick="showAddGuestModal()" class="btn-primary">+ Add Guest</button>
        </section>

        <section class="guest-stats">
            <div class="stat-pill">
                <span class="label">Total Invited:</span>
                <span class="value" id="total-guests">0</span>
            </div>
            <div class="stat-pill confirmed">
                <span class="label">Confirmed:</span>
                <span class="value" id="confirmed-guests">0</span>
            </div>
            <div class="stat-pill pending">
                <span class="label">Pending:</span>
                <span class="value" id="pending-guests">0</span>
            </div>
            <div class="stat-pill declined">
                <span class="label">Declined:</span>
                <span class="value" id="declined-guests">0</span>
            </div>
        </section>

        <section class="guest-list">
            <div class="filter-bar">
                <input type="text" id="search-guests" placeholder="Search guests..." class="search-input">
                <select id="filter-rsvp" class="filter-select">
                    <option value="all">All RSVPs</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="pending">Pending</option>
                    <option value="declined">Declined</option>
                </select>
            </div>

            <div class="guest-table">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>RSVP Status</th>
                            <th>Dietary</th>
                            <th>+1</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="guest-table-body">
                        <!-- Populated by JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Add Guest Modal -->
    <div id="add-guest-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeAddGuestModal()">&times;</span>
            <h3>Add New Guest</h3>
            <form id="add-guest-form">
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="guest-name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="guest-email">
                </div>
                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" id="guest-phone">
                </div>
                <div class="form-group">
                    <label>RSVP Status</label>
                    <select id="guest-rsvp">
                        <option value="pending">Pending</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="declined">Declined</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Dietary Restrictions</label>
                    <input type="text" id="guest-dietary" placeholder="e.g., Vegetarian, Gluten-free">
                </div>
                <div class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="guest-plusone">
                        Bringing a +1
                    </label>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Add Guest</button>
                    <button type="button" onclick="closeAddGuestModal()" class="btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2025 Christmas Party Planning Central. Made with ❤️ and festive cheer!</p>
    </footer>

    <script src="guests.js"></script>
</body>
</html>
